<defs>
  <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7a4526"/><stop offset="0.55" stop-color="#5a3018"/><stop offset="1" stop-color="#3a1d0e"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="4" result="t"/>
    <feDiffuseLighting in="t" surfaceScale="2.2" lighting-color="#fff" result="lit"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in" result="clip"/>
    <feBlend in="clip" in2="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="pebble" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="2" seed="9" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 0 0.02  0 0 0 0.55 -0.1"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <radialGradient id="tileLight" cx="0.35" cy="0.25" r="0.9">
    <stop offset="0" stop-color="#fff" stop-opacity="0.22"/><stop offset="0.6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <linearGradient id="brass" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
    <stop offset="0" stop-color="#f7dc95"/><stop offset="0.3" stop-color="#c9973f"/><stop offset="0.55" stop-color="#8d6222"/><stop offset="0.75" stop-color="#d8ad58"/><stop offset="1" stop-color="#6e4a17"/>
  </linearGradient>
  <linearGradient id="brassIn" x1="0.85" y1="0.9" x2="0.15" y2="0.1">
    <stop offset="0" stop-color="#f2d388"/><stop offset="0.5" stop-color="#a87a30"/><stop offset="1" stop-color="#5e3e12"/>
  </linearGradient>
  <radialGradient id="platter" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e9ecee"/><stop offset="0.45" stop-color="#b8bfc5"/><stop offset="0.8" stop-color="#d7dbde"/><stop offset="1" stop-color="#8e959b"/>
  </radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6e8ea"/><stop offset="0.5" stop-color="#8b9298"/><stop offset="1" stop-color="#3e4449"/>
  </linearGradient>
  <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a3f44"/><stop offset="0.5" stop-color="#1c1f22"/><stop offset="1" stop-color="#4a5056"/>
  </linearGradient>
  <linearGradient id="glass" x1="0.2" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter>
  <filter id="small" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/></filter>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  <clipPath id="face"><circle cx="512" cy="512" r="248"/></clipPath>
</defs>
