[package]
name = "disk-atlas"
version = "0.1.0"
description = "Disk usage rendered as a generated world map"
authors = ["Guillaume Jones"]
edition = "2024"
default-run = "disk-atlas"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "disk_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
delaunator = "1"
noise = "0.9"
libc = "0.2"
tiny_http = "0.12"
form_urlencoded = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Procedural generation converts freely between cell counts, indices and coordinates.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Internal API; results are always used.
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
